services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-flight-alerts-app}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - PORT=4000
      - MODE=production
    ports:
      - "${APP_HOST_PORT:-4000}:4000"
    restart: unless-stopped
    mem_limit: 600m
    memswap_limit: 900m
